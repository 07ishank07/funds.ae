# Publishes what editors decide in the Sanity Studio: approved news stories, sponsors, events
# and editorial content (Top Tweets, Advertise packages, page copy).
#
# Runs when:
#   - an editor publishes in the Studio, or changes a story's status in the News Review Queue:
#     Sanity's webhook sends a repository_dispatch "cms-publish" event (setup: docs/SANITY-CMS-GUIDE.md
#     and docs/NEWS-REVIEW-GUIDE.md);
#   - once a day at 09:00 Sydney time, so stories scheduled for later go live (live mode with the Sanity
#     queue only). A story scheduled for an earlier time also goes live with any other run before then;
#   - someone saves backend/config/{sponsors,events,content,news-taxonomy}.json by hand (source "file");
#   - you run it from the Actions tab.
#
# With settings.json content.source / news.registry.source = "sanity" it first copies the published
# Sanity content, news sources and categories into backend/config/ (`npm run cms:pull`). Every file is
# validated before anything is written; on any problem that part is not written, the run is marked
# red with the reasons, and the site keeps its current content. `npm run news:publish` then publishes
# only stories an approver published, using the read-only token.
name: Publish content

on:
  repository_dispatch:
    types: [cms-publish]
  schedule:
    # 09:00 Sydney time, for scheduled stories. GitHub schedules are in UTC and Sydney is UTC+11 in summer
    # (daylight saving) and UTC+10 in winter, so both times are scheduled and only the one at 09:00 in
    # Sydney goes ahead (see "Decide whether this run has work"). GitHub may start it a few minutes late.
    - cron: "0 22 * * *"   # 09:00 Sydney during daylight saving (about October to April)
    - cron: "0 23 * * *"   # 09:00 Sydney the rest of the year
  push:
    branches: [main]
    paths:
      - "backend/config/sponsors.json"
      - "backend/config/events.json"
      - "backend/config/content.json"
      - "backend/config/news-taxonomy.json"
      - "assets/sponsors/**"
  workflow_dispatch:
    inputs:
      allow_drop:
        description: "Let the number of live stories fall sharply. Only for the switch from demo to live mode, or a deliberate clean-up (docs/NEWS-REVIEW-GUIDE.md, Part 8)."
        type: boolean
        default: false

permissions:
  contents: write
  pages: write

concurrency:
  group: fundsae-data
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Read where content comes from
        id: source
        run: |
          echo "content=$(node -p "require('./config/settings.json').content?.source || 'file'")" >> "$GITHUB_OUTPUT"
          echo "registry=$(node -p "require('./config/settings.json').news?.registry?.source || 'file'")" >> "$GITHUB_OUTPUT"
          echo "store=$(node -p "require('./config/settings.json').news?.review?.store || 'file'")" >> "$GITHUB_OUTPUT"

      # The daily run only matters for stories scheduled in the Sanity queue, and only the schedule that
      # falls at 09:00 in Sydney runs it.
      - name: Decide whether this run has work
        id: work
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          offset=$(TZ=Australia/Sydney date +%z)
          schedule="${{ github.event.schedule }}"
          if [ "${{ steps.source.outputs.store }}" != "sanity" ]; then
            echo "go=false" >> "$GITHUB_OUTPUT"; echo "Daily runs only publish scheduled stories from the Sanity queue."
          elif { [ "$offset" = "+1100" ] && [ "$schedule" = "0 22 * * *" ]; } || { [ "$offset" = "+1000" ] && [ "$schedule" = "0 23 * * *" ]; }; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"; echo "Sydney is at UTC$offset, so the other daily schedule is the 09:00 run. Nothing to do here."
          fi

      - name: Pull published content, news sources and categories from Sanity
        if: steps.work.outputs.go == 'true' && github.event_name != 'push' && github.event_name != 'schedule' && (steps.source.outputs.content == 'sanity' || steps.source.outputs.registry == 'sanity')
        env:
          SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
          SANITY_DATASET: ${{ secrets.SANITY_DATASET }}
          SANITY_READ_TOKEN: ${{ secrets.SANITY_READ_TOKEN }}
        run: npm run cms:pull

      - name: Validate and publish sponsors, events and content
        if: steps.work.outputs.go == 'true'
        run: npm run publish:content

      - name: Publish approved news
        if: steps.work.outputs.go == 'true'
        env:
          SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
          SANITY_DATASET: ${{ secrets.SANITY_DATASET }}
          SANITY_READ_TOKEN: ${{ secrets.SANITY_READ_TOKEN }}
        run: npm run news:publish -- ${{ inputs.allow_drop && '--allow-drop' || '' }}

      - name: Save to the repository
        if: steps.work.outputs.go == 'true'
        working-directory: .
        run: |
          git config user.name "funds-ae-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/config/sponsors.json backend/config/events.json backend/config/content.json \
                  backend/config/sources.news.json backend/config/news-taxonomy.json \
                  api/v1 frontend_demo/news
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          case "${{ github.event_name }}" in
            repository_dispatch) message="Publish content from Sanity" ;;
            schedule) message="Publish scheduled news" ;;
            *) message="Publish content" ;;
          esac
          git commit -m "$message"
          # The publish steps also update backend/data/*/run-history.json, which is not committed
          # here; --autostash sets it aside so the rebase can run (without it every run fails).
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 10
          done
          exit 1

      - name: Refresh GitHub Pages
        if: always() && steps.work.outputs.go == 'true'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" >/dev/null 2>&1 || echo "Pages will rebuild on its own."

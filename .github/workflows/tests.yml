# Runs the automated tests whenever backend code or configuration changes.
name: Tests

on:
  push:
    paths:
      - "backend/src/**"
      - "backend/test/**"
      - "backend/config/**"
      - "backend/fixtures/**"
      - "backend/package*.json"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - run: npm run validate
      - run: npm test
